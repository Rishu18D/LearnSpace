services:
  - type: web
    name: learnspace-backend
    runtime: docker
    rootDir: .
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "true"
      - key: FRONTEND_DIST_DIR
        value: /app/frontend-dist
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: MONGO_AUTH_URI
        sync: false
      - key: MONGO_STUDENTS_URI
        sync: false
      - key: MONGO_COURSES_URI
        sync: false
      - key: MONGO_ENROLLMENTS_URI
        sync: false
      - key: MONGO_NOTIFICATIONS_URI
        sync: false
      - key: MONGO_PROGRESS_URI
        sync: false
      - key: MONGO_ANALYTICS_URI
        sync: false
      - key: RABBITMQ_URL
        sync: false
